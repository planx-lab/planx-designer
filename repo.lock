## Scope

One React/TypeScript application for pipeline authoring and monitoring.
Produce canonical PipelineSpec v4 and use the HTTP control plane.
The browser does not execute a second DAG/CEL runtime.

## Source ownership

src/api/             HTTP control-plane clients
src/components/      Workbench, editor, canvas, catalog, monitoring and UI controls
src/lib/             Frontend utilities
src/stores/          Draft, catalog, tenant and UI state
src/types/           Frontend contract types
src/styles/          Accepted theme and design tokens
docs/                Useful frontend documentation and evidence

Keep application source in src/ with the existing structure and required public
assets/build configuration. Do not split new packages, recreate planx-admin or
keep a competing production prototype.

## Boundaries

Do not import Go implementation modules or React Flow internal types outside
the owning frontend types. Consume the existing Catalog and schema/capabilities.

The canonical topology is a static DAG. Preserve its nodes, edges and validation
rules. A restricted UI operation must report its limit rather than silently
rewriting or imposing a linear-only runtime contract.

Component-aware forms and local draft validation are permitted. Backend domain
validation and public typed-data/CEL semantics remain authoritative. Preserve
exact values, tenant/resource-version scope, secrets and evidence invalidation.

Keep protocol/model changes within explicit ADR-017 approval and synchronized
consumers. No unrelated runtime or tenant redesign follows from UI work.
